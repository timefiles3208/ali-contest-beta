name: Refresh game data

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'timefiles3208/ali-contest-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [datatft, dataj]
    concurrency:
      group: catalog-${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and publish snapshot
        env:
          CATALOG_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          branch="live-$CATALOG_SOURCE"
          worktree="$RUNNER_TEMP/catalog"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git fetch --depth 1 origin "refs/heads/$branch"
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            status=$?
            test "$status" -eq 2
            git worktree add --detach "$worktree" HEAD
            git -C "$worktree" switch --orphan "$branch"
          fi
          snapshot="$worktree/18.7.json"
          node scripts/refresh-catalog.mjs "$CATALOG_SOURCE" "$RUNNER_TEMP/checked.json" "$snapshot"
          cp "$RUNNER_TEMP/checked.json" "$snapshot"
          git -C "$worktree" add 18.7.json
          if git -C "$worktree" diff --cached --quiet; then
            exit 0
          fi
          git -C "$worktree" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh $CATALOG_SOURCE 18.7 data"
          git -C "$worktree" push origin "HEAD:refs/heads/$branch"
